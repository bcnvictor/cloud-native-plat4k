[metadata]
name = cnp-cli
version = 0.1.0
description = Cloud Native Platform CLI

[options]
install_requires =
    typer>=0.9.0
    rich>=13.0.0
    requests>=2.31.0
    pydantic>=2.0.0
    toml>=0.10.2
packages =
    cli
    cli.commands
    cli.core
package_dir =
    cli = .

[options.entry_points]
console_scripts =
    cnp = cli.main:app
