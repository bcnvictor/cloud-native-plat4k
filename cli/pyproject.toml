[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cnp-cli"
version = "0.1.0"
description = "Cloud Native Platform CLI"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "toml>=0.10.2"
]

[project.scripts]
cnp = "cli.main:app"
