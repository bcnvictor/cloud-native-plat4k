[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cnp-backend"
version = "0.1.0"
description = "Cloud Native Platform Backend"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "asyncpg",
    "alembic",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "pydantic-settings",
    "pydantic[email]",
    "cryptography",
    "psycopg2-binary",
    "slowapi",
    "boto3"
]
