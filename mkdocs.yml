      - Service discovery & health: guides/cluster-health-monitoring.md
      - Déploiement sur cnp-control: guides/cnp-control-deployment.md
      - Opérations cluster AKS: guides/operations.md
      - Runbook Vault: guides/vault-runbook.md
      - Test CI Injector: guides/test-ci-injector.md
