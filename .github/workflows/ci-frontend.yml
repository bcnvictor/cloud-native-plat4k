# CI — Frontend (React + TypeScript + Vite)
#
# Déclenché uniquement quand frontend/ change.
# Deux jobs :
#   1. lint-and-build : ESLint + TypeScript (via npm run build qui fait tsc + vite build)
#   2. docker-build   : build l'image Nginx, push sur GHCR uniquement sur main
#
# Secrets requis : aucun (GITHUB_TOKEN est injecté automatiquement par GitHub Actions).

name: CI — Frontend

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'

jobs:
  # ─── Job 1 : qualité du code ──────────────────────────────────────────────
  lint-and-build:
    name: Lint, type check & build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # ESLint avec --max-warnings 0 (configuré dans package.json)
      - name: Lint — ESLint
        run: npm run lint

      # TypeScript + Vite build (tsc && vite build).
      # Échoue si des erreurs de types ou des imports manquants sont détectés.
      - name: Type check & build
        run: npm run build

  # ─── Job 2 : image Docker ─────────────────────────────────────────────────
  docker-build:
    name: Build & push image Docker (frontend)
    runs-on: ubuntu-latest
    needs: lint-and-build

    permissions:
      contents: read
      packages: write   # nécessaire pour pousser sur GHCR

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authentification sur ghcr.io avec le token GitHub automatique
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build toujours (valide le Dockerfile).
      # Push uniquement sur main (évite de polluer GHCR avec des branches de travail).
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          # Cache layer Docker entre les runs pour accélérer les builds
          cache-from: type=gha
          cache-to: type=gha,mode=max
