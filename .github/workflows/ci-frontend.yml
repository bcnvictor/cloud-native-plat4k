# CI — Frontend (React + TypeScript + Vite)
#
# Déclenché uniquement quand frontend/ change.
# Jobs :
#   1. lint-and-build : ESLint + TypeScript (via npm run build qui fait tsc + vite build)
#   2. e2e            : tests Playwright (login, RBAC, création d'app) contre un backend de test
#   3. docker-build   : build l'image Nginx, push sur GHCR uniquement sur main
#
# Secrets requis : aucun (GITHUB_TOKEN est injecté automatiquement par GitHub Actions).

name: CI — Frontend

on:
  push:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'shared/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'shared/**'
      - '.github/workflows/ci-frontend.yml'

jobs:
  # ─── Job 1 : qualité du code ──────────────────────────────────────────────
  lint-and-build:
    name: Lint, type check & build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # ESLint avec --max-warnings 0 (configuré dans package.json)
      - name: Lint — ESLint
        run: npm run lint

      # Tests unitaires (Vitest + Testing Library)
      - name: Test — Vitest
        run: npm run test

      # TypeScript + Vite build (tsc && vite build).
      # Échoue si des erreurs de types ou des imports manquants sont détectés.
      - name: Type check & build
        run: npm run build

  # ─── Job 2 : tests E2E Playwright ─────────────────────────────────────────
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: cnpuser
          POSTGRES_PASSWORD: cnppass
          POSTGRES_DB: cnp_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cnpuser -d cnp_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: e2e-secret-key-for-testing-only-32chars!
      ENCRYPTION_KEY: ''
      POSTGRES_SERVER: localhost
      POSTGRES_USER: cnpuser
      POSTGRES_PASSWORD: cnppass
      POSTGRES_DB: cnp_e2e
      SECURE_COOKIES: 'false'
      BACKEND_CORS_ORIGINS: '["http://localhost:3000"]'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            shared/pyproject.toml

      - name: Install backend
        run: |
          pip install -e ./shared
          pip install -e ./backend

      - name: Run DB migrations
        run: python -m alembic -c backend/alembic.ini upgrade head

      - name: Seed E2E users
        run: python -m backend.scripts.seed_e2e_users

      - name: Start backend
        run: nohup python -m uvicorn backend.main:app --port 8000 > backend-e2e.log 2>&1 &

      - name: Wait for backend
        run: npx --yes wait-on@7 http-get://localhost:8000/api/v1/health/ -t 30000 || (cat backend-e2e.log; exit 1)

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: frontend
        env:
          CI: 'true'
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload backend logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-e2e-logs
          path: backend-e2e.log
          retention-days: 7

  # ─── Job 3 : image Docker ─────────────────────────────────────────────────
  docker-build:
    name: Build & push image Docker (frontend)
    runs-on: ubuntu-latest
    needs: lint-and-build

    permissions:
      contents: read
      packages: write   # nécessaire pour pousser sur GHCR

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authentification sur ghcr.io avec le token GitHub automatique
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build toujours (valide le Dockerfile).
      # Push uniquement sur main (évite de polluer GHCR avec des branches de travail).
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          # Cache layer Docker entre les runs pour accélérer les builds
          cache-from: type=gha
          cache-to: type=gha,mode=max
