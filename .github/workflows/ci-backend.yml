# CI — Backend (FastAPI + shared)
#
# Déclenché uniquement quand backend/ ou shared/ changent.
# Deux jobs :
#   1. lint-and-typecheck : ruff + mypy + pytest --collect-only (pas de DB requise)
#   2. docker-build       : build l'image, push sur GHCR uniquement sur main
#
# Secrets requis : aucun (GITHUB_TOKEN est injecté automatiquement par GitHub Actions).

name: CI — Backend

on:
  push:
    paths:
      - 'backend/**'
      - 'shared/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'shared/**'
      - '.github/workflows/ci-backend.yml'

jobs:
  # ─── Job 1 : qualité du code ──────────────────────────────────────────────
  lint-and-typecheck:
    name: Lint & type check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            shared/pyproject.toml

      - name: Install dev tools
        run: pip install ruff mypy pytest

      - name: Install shared package
        run: pip install -e ./shared

      - name: Install backend package
        run: pip install -e ./backend

      # Vérification syntaxe et style Python
      - name: Lint — ruff
        run: ruff check backend/ shared/

      # Vérification des types (--ignore-missing-imports car certaines dépendances
      # comme kubernetes n'ont pas de stubs mypy publiés)
      - name: Type check — mypy
        run: mypy backend/ shared/ --ignore-missing-imports

      # Vérifie que pytest peut découvrir les tests (structure cohérente).
      # Retourne toujours 0 — il n'y a pas encore de tests à faire passer.
      - name: Test structure — pytest collect
        run: pytest backend/tests/ --collect-only -q

  # ─── Job 2 : image Docker ─────────────────────────────────────────────────
  docker-build:
    name: Build & push image Docker (backend)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    permissions:
      contents: read
      packages: write   # nécessaire pour pousser sur GHCR

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authentification sur ghcr.io avec le token GitHub automatique
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build toujours (valide le Dockerfile).
      # Push uniquement sur main (évite de polluer GHCR avec des branches de travail).
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          # Cache layer Docker entre les runs pour accélérer les builds
          cache-from: type=gha
          cache-to: type=gha,mode=max
