name: Pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend — lint & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            shared/pyproject.toml

      - name: Install dev tools
        run: pip install ruff

      - name: Install shared package
        run: pip install -e ./shared

      - name: Install backend package
        run: pip install -e "./backend[test]"

      - name: Lint — ruff
        run: ruff check backend/ shared/

      - name: Test — pytest
        run: pytest backend/tests/ -v

  frontend:
    name: Frontend — lint, type check & build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-new

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-new/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint — ESLint
        run: npm run lint

      - name: Test — Vitest
        run: npm run test

      - name: Type check & build
        run: npm run build

  deploy:
    name: Deploy — cnp-control
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/cloud-native-plat4k
            git fetch origin
            git checkout main
            git pull
            docker compose up -d --build
            echo "Deploy complete — $(git rev-parse --short HEAD)"
