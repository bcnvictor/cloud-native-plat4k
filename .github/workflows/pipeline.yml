name: Pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend — lint & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Check lockfiles are up to date
        run: |
          ./scripts/lock-deps.sh
          git diff --exit-code backend/requirements.lock backend/requirements-dev.lock infra/keycloak/requirements.lock \
            cnp-mcp/requirements.lock cnp-mcp/requirements-dev.lock \
            || { echo "::error::Lockfiles désynchronisés des pyproject.toml — lancer ./scripts/lock-deps.sh et committer"; exit 1; }

      - name: Install locked dependencies
        run: pip install -r backend/requirements-dev.lock

      - name: Install shared & backend packages
        run: pip install --no-deps -e ./shared -e ./backend

      - name: Lint — ruff
        run: ruff check backend/ shared/

      - name: Test — pytest
        run: pytest backend/tests/ -m 'not keycloak_integration and not keycloak_infra' -v

      # La CLI n'a pas de lockfile : ses dépendances propres (typer, rich, toml)
      # sont résolues depuis cli/setup.cfg, le reste vient du lock backend ci-dessus.
      - name: Install CLI package
        run: pip install -e ./cli

      - name: Test — pytest CLI
        run: pytest cli/tests/ -v

  frontend:
    name: Frontend — lint, type check & build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-new

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-new/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint — ESLint
        run: npm run lint

      - name: Test — Vitest
        run: npm run test

      - name: Type check & build
        run: npm run build

  mcp:
    name: MCP server — lint & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: cnp-mcp/requirements-dev.lock

      - name: Install locked dependencies
        run: pip install -r cnp-mcp/requirements-dev.lock

      - name: Install cnp-mcp package
        run: pip install --no-deps -e ./cnp-mcp

      - name: Lint — ruff
        run: ruff check cnp-mcp/

      - name: Test — pytest
        run: pytest cnp-mcp/tests/ -v

  # Le socle que CNP impose aux apps (ADR-0011), appliqué au repo CNP lui-même (4K-47).
  # Images épinglées ; configs : .gitleaks.toml, .hadolint.yaml. Une CVE sans correctif
  # disponible ne bloque pas (--ignore-unfixed) ; une exception assumée va dans .trivyignore.
  security:
    name: Security — gitleaks, hadolint, trivy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks parcourt tout l'historique

      - name: Secrets — gitleaks
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            zricethezav/gitleaks:v8.21.2 git /repo --no-banner --redact --config /repo/.gitleaks.toml

      - name: Dockerfiles — hadolint
        run: |
          docker run --rm -v "$PWD:/w:ro" -w /w hadolint/hadolint:v2.12.0 \
            hadolint --config .hadolint.yaml backend/Dockerfile cnp-mcp/Dockerfile frontend-new/Dockerfile

      - name: Dépendances — trivy
        # requirements*.lock n'est pas un nom reconnu par trivy : --file-patterns les déclare pip
        run: |
          docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.58.1 fs \
            --exit-code 1 --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --skip-dirs node_modules --file-patterns 'pip:requirements(-dev)?\.lock' /src

  deploy:
    name: Deploy — cnp-control
    runs-on: ubuntu-latest
    needs: [backend, frontend, mcp, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/cloud-native-plat4k
            git fetch origin
            git checkout main
            git pull
            docker compose --profile production up -d --build
            echo "Deploy complete — $(git rev-parse --short HEAD)"
