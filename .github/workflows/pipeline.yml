name: Pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend — lint & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Check lockfiles are up to date
        run: |
          ./scripts/lock-deps.sh
          git diff --exit-code backend/requirements.lock backend/requirements-dev.lock \
            || { echo "::error::Lockfiles désynchronisés des pyproject.toml — lancer ./scripts/lock-deps.sh et committer"; exit 1; }

      - name: Install locked dependencies
        run: pip install -r backend/requirements-dev.lock

      - name: Install shared & backend packages
        run: pip install --no-deps -e ./shared -e ./backend

      - name: Lint — ruff
        run: ruff check backend/ shared/

      - name: Test — pytest
        run: pytest backend/tests/ -v

  frontend:
    name: Frontend — lint, type check & build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-new

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-new/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint — ESLint
        run: npm run lint

      - name: Test — Vitest
        run: npm run test

      - name: Type check & build
        run: npm run build

  deploy:
    name: Deploy — cnp-control
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/cloud-native-plat4k
            git fetch origin
            git checkout main
            git pull
            docker compose --profile production up -d --build
            echo "Deploy complete — $(git rev-parse --short HEAD)"
