name: Deploy — cnp-control (Oracle VM)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to cnp-control
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/cloud-native-plat4k
            git fetch origin
            git checkout main
            git pull
            docker compose up -d --build
            echo "Deploy complete — $(git rev-parse --short HEAD)"
