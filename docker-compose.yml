services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cnpuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cnppass}
      POSTGRES_DB: ${POSTGRES_DB:-cnp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-cnpuser} -d ${POSTGRES_DB:-cnp}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cnp_net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=${POSTGRES_USER:-cnpuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-cnppass}
      - POSTGRES_DB=${POSTGRES_DB:-cnp}
      - SECRET_KEY=${SECRET_KEY:-change_this_to_a_secure_random_string_of_at_least_32_characters}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - SECURE_COOKIES=${SECURE_COOKIES:-false}
      - GITLAB_OAUTH_CLIENT_ID=${GITLAB_OAUTH_CLIENT_ID:-}
      - GITLAB_OAUTH_CLIENT_SECRET=${GITLAB_OAUTH_CLIENT_SECRET:-}
      - GITLAB_OAUTH_REDIRECT_URI=${GITLAB_OAUTH_REDIRECT_URI:-}
      - GITLAB_OAUTH_SCOPES=${GITLAB_OAUTH_SCOPES:-api read_user}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-http://localhost}
      - CLI_REDIRECT_BASE_URL=${CLI_REDIRECT_BASE_URL:-http://localhost:8765}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-["http://localhost:3000","http://localhost"]}
      - K8S_TARGET_NAMESPACE=${K8S_TARGET_NAMESPACE:-default}
      - K8S_IMAGE_PULL_SECRET=${K8S_IMAGE_PULL_SECRET:-}
      - GITLAB_BASE_URL=${GITLAB_BASE_URL:-https://gitlab.com}
      - GITLAB_BOT_TOKEN=${GITLAB_BOT_TOKEN:-}
      - GITLAB_BOT_NAMESPACE=${GITLAB_BOT_NAMESPACE:-}
      - GITLAB_TEAMS_GROUP=${GITLAB_TEAMS_GROUP:-}
      - GITLAB_APPS_NAMESPACE=${GITLAB_APPS_NAMESPACE:-}
      - GITLAB_TEMPLATES_NAMESPACE=${GITLAB_TEMPLATES_NAMESPACE:-}
      - GITLAB_REGISTRY_URL=${GITLAB_REGISTRY_URL:-registry.gitlab.com}
      - GITLAB_CI_PROJECT=${GITLAB_CI_PROJECT:-}
      - CNP_API_BASE_URL=${CNP_API_BASE_URL:-http://localhost:8000}
      - GITLAB_WEBHOOK_SECRET=${GITLAB_WEBHOOK_SECRET:-}
      - ARGOCD_WEBHOOK_SECRET=${ARGOCD_WEBHOOK_SECRET:-}
      - GITOPS_REPO_URL=${GITOPS_REPO_URL:-}
      - PROMETHEUS_URL=${PROMETHEUS_URL:-http://prometheus-operated.monitoring.svc.cluster.local:9090}
      - LOKI_URL=${LOKI_URL:-http://loki.monitoring.svc.cluster.local:3100}
      - VAULT_ADDR=${VAULT_ADDR:-http://vault:8200}
      - VAULT_TOKEN=${VAULT_TOKEN:-cnp-dev-token}
      - GRAFANA_URL=${GRAFANA_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cnp_net

  grafana:
    profiles:
      - production
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SERVER_ROOT_URL=${GRAFANA_URL:-http://localhost:3000}
      - PROMETHEUS_URL=${PROMETHEUS_URL:-http://prometheus-operated.monitoring.svc.cluster.local:9090}
      - LOKI_URL=${LOKI_URL:-http://loki.monitoring.svc.cluster.local:3100}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - cnp_net

  vault:
    profiles:
      - production
    image: hashicorp/vault:1.17
    ports:
      - "8200:8200"
    volumes:
      - vault_data:/vault/data
      - ./vault.hcl:/vault/vault.hcl:ro
    command: server -config=/vault/vault.hcl
    cap_add:
      - IPC_LOCK
    healthcheck:
      # vault status retourne exit 2 quand sealed (état normal avant unseal),
      # ce qui ne doit pas être considéré comme un échec — on accepte 0 et 2.
      test: ["CMD-SHELL", "vault status; s=$?; [ $s -eq 0 ] || [ $s -eq 2 ]"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - cnp_net

  frontend:
    build:
      context: ./frontend-new
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    ports:
      - "80:80"
    volumes:
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_started
    networks:
      - cnp_net

  nginx-grafana:
    profiles:
      - production
    image: nginx:alpine
    ports:
      - "443:443"
    volumes:
      - ./infra/grafana/nginx-grafana.conf.template:/etc/nginx/grafana.conf.template:ro
      - ./infra/grafana/docker-entrypoint-grafana-nginx.sh:/docker-entrypoint-grafana-nginx.sh:ro
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot:ro
    environment:
      - GRAFANA_DOMAIN=${GRAFANA_DOMAIN}
    entrypoint: ["/bin/sh", "/docker-entrypoint-grafana-nginx.sh"]
    depends_on:
      - grafana
    networks:
      - cnp_net
    restart: unless-stopped

  certbot:
    profiles:
      - production
    image: certbot/certbot
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'
    networks:
      - cnp_net
    restart: unless-stopped

networks:
  cnp_net:
    driver: bridge

volumes:
  postgres_data:
  vault_data:
  grafana_data:
  letsencrypt:
  certbot_webroot:
