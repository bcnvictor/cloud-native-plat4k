[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shared"
version = "0.1.0"
description = "Shared models for CNP"
dependencies = [
    "pydantic[email]"
]

# Même config que backend/pyproject.toml : sans elle, ruff applique ses règles
# par défaut, qui changent d'une version à l'autre (ruff 0.16 a ajouté UP*).
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E712"]
