app:
  name: my-app
  port: 8000

image:
  repository: registry.gitlab.com/cnp/my-app
  tag: latest
  pullPolicy: IfNotPresent

replicas: 1

# Map of environment variables: KEY: "value"
env: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

ingress:
  enabled: false
  host: ""
  tls: false
