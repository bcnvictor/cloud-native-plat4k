# Exemple de Secret K8s contenant le token Vault statique d'ESO.
# NE PAS committer la version avec un vrai token — préférer la commande
# impérative (voir README étape 3), qui n'écrit rien sur disque :
#
#   kubectl create secret generic vault-eso-token \
#     --namespace external-secrets \
#     --from-literal=token=<eso_token> \
#     --context cnp-aks
#
# Ce fichier sert uniquement de référence pour comprendre la forme attendue
# par cluster-secret-store.yaml (auth.tokenSecretRef).
apiVersion: v1
kind: Secret
metadata:
  name: vault-eso-token
  namespace: external-secrets
type: Opaque
stringData:
  token: "<eso_token>"
