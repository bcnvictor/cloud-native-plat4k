# Smoke test 4K-105 — vérifie que ESO synchronise bien Vault -> Secret K8s.
#
# Cible secret/apps/_smoke-test/eso, PAS secret/cnp/platform : la policy
# eso-reader est volontairement restreinte à secret/apps/* (voir
# policy-eso-reader.hcl et README, section "Écart avec l'énoncé du ticket").
#
# Seeder d'abord la valeur de test dans Vault (voir README étape 6), puis :
#   kubectl apply -f infra/eso/test-external-secret.yaml --context cnp-aks
#   kubectl apply -f infra/eso/test-external-secret.yaml --kubeconfig cnp-k3s.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: eso-smoke-test
  namespace: external-secrets
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: eso-smoke-test
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: secret/apps/_smoke-test/eso
