# ClusterSecretStore "vault-backend" — identique sur AKS et cnp-k3s (4K-105 / ADR-0024).
#
# Auth par token statique pendant la période transitoire (avant migration AppRole,
# cf. ADR-0016 / ADR-0024). Le token est lu depuis le Secret K8s "vault-eso-token"
# dans le namespace "external-secrets" (voir vault-eso-token-secret.example.yaml et
# l'étape 3 du README).
#
# Le server pointe vers le Service egress Tailscale (vault-egress-service.yaml),
# PAS directement vers l'IP tailnet de cnp-control — voir README section
# "Accès réseau pod -> cnp-control" pour l'explication complète.
#
# kubectl apply -f infra/eso/cluster-secret-store.yaml --context cnp-aks
# kubectl apply -f infra/eso/cluster-secret-store.yaml --kubeconfig cnp-k3s.yaml
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://vault-cnp-control.external-secrets.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        tokenSecretRef:
          name: vault-eso-token
          namespace: external-secrets
          key: token
