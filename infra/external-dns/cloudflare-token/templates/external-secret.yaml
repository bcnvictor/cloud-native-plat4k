apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ required "targetSecretName is required" .Values.targetSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  refreshInterval: {{ .Values.refreshInterval | quote }}
  secretStoreRef:
    name: {{ required "secretStoreRef.name is required" .Values.secretStoreRef.name }}
    kind: {{ required "secretStoreRef.kind is required" .Values.secretStoreRef.kind }}
  target:
    name: {{ .Values.targetSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ required "targetSecretKey is required" .Values.targetSecretKey }}
      remoteRef:
        key: {{ required "vaultKey is required" .Values.vaultKey }}
        property: {{ required "vaultProperty is required" .Values.vaultProperty }}
