apiVersion: v2
name: cnp-cluster-issuers
# Bump on every template/values change: the Terraform helm provider only
# re-deploys a local chart when its version (or a set value) changes.
version: 0.1.0
description: >-
  Let's Encrypt ClusterIssuers (ACME HTTP-01 via ingress-nginx) used by the
  Certificates CNP writes for exposed apps. Installed by Terraform (infra/aks,
  infra/oracle/k3s) after the cert-manager release, which owns the CRDs.
