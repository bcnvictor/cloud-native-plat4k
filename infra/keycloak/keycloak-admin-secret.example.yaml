# Shape reference ONLY — never commit real values. Create with a literal command
# instead (see README.md step 3):
#
#   kubectl create secret generic keycloak-admin \
#     --namespace keycloak \
#     --from-literal=username=admin \
#     --from-literal=password=<random, generated once, store in a password manager> \
#     --context cnp-aks
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin
  namespace: keycloak
type: Opaque
stringData:
  username: admin
  password: "<REPLACE_ME>"
