# Dedicated PostgreSQL database for Keycloak (4K-15/ADR-0026) — deliberately NOT
# shared with the CNP backend's own database. A single-replica StatefulSet, same
# pragmatic pattern as the postgresql block CNP generates for scaffolded apps
# (backend/services/scaffolding_service.py) — no HA, acceptable for this platform's
# scale, revisit if Keycloak availability becomes critical.
#
# Credentials come from the "keycloak-db" Secret — bootstrap it by hand before
# applying this file (see README.md step 2), never commit real values here.
#
# kubectl apply -f infra/keycloak/postgres.yaml --context cnp-aks
apiVersion: v1
kind: Service
metadata:
  name: keycloak-postgres
  namespace: keycloak
spec:
  clusterIP: None
  selector:
    app: keycloak-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak-postgres
  namespace: keycloak
spec:
  serviceName: keycloak-postgres
  replicas: 1
  selector:
    matchLabels:
      app: keycloak-postgres
  template:
    metadata:
      labels:
        app: keycloak-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: keycloak
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: keycloak-db
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db
                  key: password
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "keycloak"]
            initialDelaySeconds: 10
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
