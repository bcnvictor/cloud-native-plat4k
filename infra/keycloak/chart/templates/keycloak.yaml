apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-keycloak
  labels:
    {{- include "cnp-keycloak.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: {{ .Release.Name }}-keycloak}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}-keycloak}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: keycloak
          image: {{ .Values.images.keycloak | quote }}
          args: [start]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          env:
            - {name: KC_DB, value: postgres}
            - {name: KC_DB_URL, value: "jdbc:postgresql://{{ .Release.Name }}-postgres:5432/keycloak"}
            - {name: KC_DB_USERNAME, valueFrom: {secretKeyRef: {name: keycloak-db, key: username}}}
            - {name: KC_DB_PASSWORD, valueFrom: {secretKeyRef: {name: keycloak-db, key: password}}}
            - {name: KC_BOOTSTRAP_ADMIN_USERNAME, valueFrom: {secretKeyRef: {name: keycloak-bootstrap, key: username}}}
            - {name: KC_BOOTSTRAP_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: keycloak-bootstrap, key: password}}}
            - {name: KC_HOSTNAME, value: "https://{{ .Values.publicDomain }}/clusters/{{ .Values.instanceKey }}"}
            - {name: KC_HOSTNAME_STRICT, value: "true"}
            - {name: KC_HTTP_RELATIVE_PATH, value: "/clusters/{{ .Values.instanceKey }}"}
            - {name: KC_HTTP_MANAGEMENT_RELATIVE_PATH, value: "/"}
            - {name: KC_HTTP_ENABLED, value: "true"}
            - {name: KC_PROXY_HEADERS, value: xforwarded}
            - {name: KC_HEALTH_ENABLED, value: "true"}
          ports: [{name: http, containerPort: 8080}, {name: management, containerPort: 9000}]
          startupProbe:
            httpGet: {path: /health/ready, port: 9000}
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health/ready, port: 9000}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health/live, port: 9000}
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-keycloak
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: {{ .Values.tailscale.hostname | quote }}
spec:
  type: ClusterIP
  selector: {app: {{ .Release.Name }}-keycloak}
  ports: [{name: http, port: 8080, targetPort: http}]
