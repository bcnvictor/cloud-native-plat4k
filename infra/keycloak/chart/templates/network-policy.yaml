apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-access
spec:
  podSelector: {matchLabels: {app: {{ .Release.Name }}-keycloak}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ .Values.tailscale.namespace }}}}
          podSelector: {matchLabels: {tailscale.com/managed: "true"}}
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to: [{podSelector: {matchLabels: {app: {{ .Release.Name }}-postgres}}}]
      ports: [{protocol: TCP, port: 5432}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}]
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-database-access
spec:
  podSelector: {matchLabels: {app: {{ .Release.Name }}-postgres}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: {{ .Release.Name }}-keycloak}}}]
      ports: [{protocol: TCP, port: 5432}]
  egress: []
