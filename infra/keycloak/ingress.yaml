# Public ingress for the shared Keycloak instance (4K-15/ADR-0026).
#
# tls: intentionally absent here, matching the convention already used by every
# app CNP exposes publicly (chart/templates/ingress.yaml in cnp-templates/*,
# ScaffoldingService._build_ingress_values defaults tls: false): this platform's
# public domain (cloud-native-plat4k.me) sits behind Cloudflare, which currently
# terminates edge TLS itself (see README.md "TLS" section for the tradeoff and
# how to move to end-to-end TLS with cert-manager later if needed — ADR-0021 used
# a different mechanism, certbot on a plain VM, which doesn't apply to an
# in-cluster Ingress).
#
# kubectl apply -f infra/keycloak/ingress.yaml --context cnp-aks
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: keycloak
spec:
  ingressClassName: nginx
  rules:
    - host: auth.cloud-native-plat4k.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
