# Shape reference ONLY — never commit real values. Create with a literal command
# instead (see README.md step 2):
#
#   kubectl create secret generic keycloak-db \
#     --namespace keycloak \
#     --from-literal=username=keycloak \
#     --from-literal=password=<random, generated once> \
#     --context cnp-aks
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-db
  namespace: keycloak
type: Opaque
stringData:
  username: keycloak
  password: "<REPLACE_ME>"
