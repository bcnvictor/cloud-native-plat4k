apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus-cnp
    url: ${PROMETHEUS_URL}
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 30s
      httpMethod: POST

  - name: Loki
    type: loki
    uid: loki-cnp
    url: ${LOKI_URL}
    editable: false
    jsonData:
      maxLines: 1000

  # cnp-k3s via le Connector Tailscale (4K-101) ; URLs par défaut dans docker-compose.yml
  - name: Prometheus cnp-k3s
    type: prometheus
    uid: prometheus-cnp-k3s
    url: ${K3S_PROMETHEUS_URL}
    editable: false
    jsonData:
      timeInterval: 30s
      httpMethod: POST

  - name: Loki cnp-k3s
    type: loki
    uid: loki-cnp-k3s
    url: ${K3S_LOKI_URL}
    editable: false
    jsonData:
      maxLines: 1000
