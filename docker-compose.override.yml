# Development overrides
services:
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@4k.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cnp_net

  backend:
    depends_on:
      db:
        condition: service_healthy
    environment:
      - VAULT_ADDR=${VAULT_ADDR:-http://130.61.112.206:8201}
      - VAULT_TOKEN=${VAULT_TOKEN:-cnp-dev-shared-token}
